name: CI

# The one workflow of this repository: the same checks as scripts/check.sh, on the three desktop OSes, for main only:
# pushes to main (made when stable), pull requests into main, once a week on main (new RustSec advisories land without
# any code change) and by hand. Never on development, where the many daily commits are checked locally.
# A newer push to the same branch or pull request cancels the older run.
# Security scanning is GitHub's CodeQL default setup (Settings, Code security), which needs no workflow file here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads rust-toolchain.toml, so the pinned toolchain installs itself.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings

  # Licences (no third-party copyleft), RustSec advisories, banned and unknown-source crates (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
