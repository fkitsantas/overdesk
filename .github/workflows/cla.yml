name: CLA

# Asks every outside contributor to sign CLA.md once, by commenting on their pull request.
# pull_request_target runs this workflow from main with no checkout of the pull request's code, so the token never meets it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only the two sign/recheck comments, or the pull request itself, start it (no other comment spends a run).
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/fkitsantas/overdesk/blob/main/CLA.md
          branch: cla-signatures
          allowlist: fkitsantas,dependabot[bot]
