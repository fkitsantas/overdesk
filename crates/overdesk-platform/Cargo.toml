[package]
name = "overdesk-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
overdesk-proto.workspace = true
xkeysym = "0.2.1"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSEvent", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Wdk_System_SystemServices", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
x11rb = { version = "0.14.0", default-features = false, features = ["xinput", "xtest", "xfixes", "randr", "xkb"] }
ashpd = { version = "0.14.3", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast"] }
reis = { version = "0.7.1", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false }
wl-clipboard-rs = "0.9.5"
