[package]
name = "overdeskd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
overdesk-core = { path = "../overdesk-core" }
overdesk-net = { path = "../overdesk-net" }
overdesk-platform = { path = "../overdesk-platform" }
overdesk-proto.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std", "io-util"] }

# Text only: the image features pull in extra crates and images are a Pro feature.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
arboard = { version = "3.7.0", default-features = false }

[lints]
workspace = true
