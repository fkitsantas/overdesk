[package]
name = "overdesk-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
overdesk-proto.workspace = true
mdns-sd = { version = "0.22.0", default-features = false }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
