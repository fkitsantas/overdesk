[package]
name = "overdesk-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Overdesk desktop app"

[[bin]]
name = "overdesk"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "canvas", "svg", "advanced", "image"] }
overdesk-core = { path = "../overdesk-core" }
overdesk-net = { path = "../overdesk-net" }
overdesk-proto.workspace = true
overdeskd = { path = "../overdeskd" }
tokio = { version = "1.54.1", features = ["sync", "time", "rt"] }
png = "0.18.1"
cargo-packager-updater = "0.2.3"
base64 = "0.23"
auto-launch = "0.6.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.27.0"

# Linux uses the StatusNotifierItem (D-Bus) backend: its own worker thread, no GTK and no
# libayatana-appindicator, so it fits an iced/winit main loop and the AppImage needs no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.27.0", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[features]
# Design review only: renders a fixed state, saves a screenshot, exits. Never shipped.
preview = []

[lints]
workspace = true
