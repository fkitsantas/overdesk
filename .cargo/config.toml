# Release installers must not need a Visual C++ Redistributable: link the C runtime into the exe.
# (Clippy from the zig cross checks only type-checks, so this does not affect it.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
