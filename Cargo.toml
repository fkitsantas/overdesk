[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/fkitsantas/overdesk"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.2.0", features = ["use-std"] }
thiserror = "2.0.21"
overdesk-proto = { path = "crates/overdesk-proto" }

[workspace.lints.rust]
unsafe_code = "deny"
# Every public item is documented.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every private item is documented too: the codebase reads as a whole.
missing_docs_in_private_items = "warn"

# Release builds: whole-program optimisation for the input hot path. Keep `panic = "unwind"`
# (the default): the macOS event tap relies on `catch_unwind` at the FFI boundary.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
